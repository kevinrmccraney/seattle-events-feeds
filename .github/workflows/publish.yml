name: Refresh normalized RSS feeds
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * 1'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate feeds and status sidecars
        run: python -m seattle_feeds.main --output-dir docs
        env:
          DICE_API_KEY: ${{ secrets.DICE_API_KEY }}
      - name: Commit generated feeds/status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feeds docs/status
          git diff --cached --quiet || git commit -m "Refresh event feeds"
          git push
